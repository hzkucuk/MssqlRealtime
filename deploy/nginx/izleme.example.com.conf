# nginx site config for the monitoring app.
#
#   Domain : izleme.example.com   (change the two server_name lines to use another subdomain)
#   Backend: Kestrel on 127.0.0.1:5199
#
# Install:
#   sudo cp izleme.example.com.conf /etc/nginx/sites-available/izleme.example.com
#   sudo ln -s /etc/nginx/sites-available/izleme.example.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate (run AFTER the DNS A record points here and the :80 block below is live):
#   sudo certbot --nginx -d izleme.example.com
# Certbot rewrites this file to add the ssl_certificate lines and the :80 → :443 redirect.

# --- WebSocket upgrade -------------------------------------------------------------------
# SignalR negotiates WebSockets first. Without this map + the Upgrade headers below, nginx
# strips the upgrade, the socket fails, and SignalR silently falls back to long polling —
# the app still "works" but every phone pays for a new HTTP request per second.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name izleme.example.com;

    # Certbot's HTTP-01 challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name izleme.example.com;

    # certbot --nginx fills these in:
    # ssl_certificate     /etc/letsencrypt/live/izleme.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/izleme.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # This app is only ever reached over TLS, including from the phone.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Snapshots of a busy server are large-ish JSON; compression pays for itself on mobile data.
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # --- SignalR hub ---------------------------------------------------------------------
    # Separate location purely for the timeouts: a hub connection is idle by design between
    # pushes, and the default 60s read timeout would drop it roughly every minute.
    location /hubs/ {
        proxy_pass         http://127.0.0.1:5199;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass         http://127.0.0.1:5199;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
    }
}
