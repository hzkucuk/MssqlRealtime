# Portainer stack — izleme.marmaracloud.net
#
# Portainer → Stacks → Add stack → Repository
#   Repository URL : https://github.com/hzkucuk/MssqlRealtime
#   Reference      : refs/heads/main
#   Compose path   : docker-compose.portainer.yml
#
# Ardindan asagidaki degiskenleri Portainer'in "Environment variables" bolumune girin
# (Portainer stack'leri .env dosyasi okumaz):
#
#   ADMIN_EMAIL      admin@marmaracloud.net
#   ADMIN_PASSWORD   en az 10 karakter, guclu
#   PUBLIC_ORIGIN    https://izleme.marmaracloud.net
#   BIND_ADDRESS     asagidaki iki senaryodan birine gore
#
# ⚠️ Ilk deploy sunucuda imaj derler (.NET SDK + Node indirilir, ~2 GB, birkac dakika).
#    Sonraki deploylar katman onbellegi sayesinde cok daha hizlidir.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mssqlrealtime:latest
    container_name: mssqlrealtime
    restart: unless-stopped

    ports:
      # ┌─ nginx AYNI sunucuda mi, BASKA sunucuda mi? Tek fark bu satir. ─┐
      #
      #   Ayni sunucuda  → BIND_ADDRESS=127.0.0.1
      #                    nginx: proxy_pass http://127.0.0.1:5199;
      #
      #   Baska sunucuda → BIND_ADDRESS=<bu sunucunun ozel IP'si>   (0.0.0.0 degil)
      #                    nginx: proxy_pass http://<bu-sunucu-ip>:5199;
      #                    🔴 Guvenlik duvari SART:
      #                       ufw allow from <nginx-ip> to any port 5199 proto tcp
      #                       ufw deny 5199
      #
      #   nginx de bu Portainer'da konteyner olarak kosuyorsa: bu blogu tamamen silin,
      #   asagidaki networks bloklarini acin ve nginx'te
      #   proxy_pass http://mssqlrealtime:8080; yazin.
      - '${BIND_ADDRESS:-127.0.0.1}:5199:8080'

    environment:
      ASPNETCORE_ENVIRONMENT: Production

      # Tek operator hesabi, ilk aciliste olusturulur. Bos birakilirsa rastgele bir parola
      # uretilip loga bir kez yazilir (Portainer → Containers → mssqlrealtime → Logs).
      Admin__Email: ${ADMIN_EMAIL:-admin@local}
      Admin__Password: ${ADMIN_PASSWORD:-}

      # Telefonun bagladigi adresle birebir ayni olmali — sema dahil.
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:-https://izleme.marmaracloud.net}
      Cors__AllowedOrigins__1: tauri://localhost
      Cors__AllowedOrigins__2: http://tauri.localhost

      # Bu sureden uzun sessiz kalan agent icin kritik alarm uretilir.
      Agents__OfflineAfterMinutes: ${AGENT_OFFLINE_MINUTES:-3}

    volumes:
      # 🔴 Yedeklenmesi gereken tek yer.
      #   mssqlrealtime.db → sunucu profilleri + operator hesabi
      #   keys/            → veri koruma anahtarlari; kaybolursa TUM kayitli SQL parolalari
      #                      okunamaz hale gelir
      #   logs/            → denetim izi
      - mssqlrealtime-data:/data

    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/api/health']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    # nginx bu Portainer'da konteynerse acin:
    # networks:
    #   - nginx-net

volumes:
  mssqlrealtime-data:
    name: mssqlrealtime-data

# nginx bu Portainer'da konteynerse acin ve ag adini yazin:
#   docker inspect <nginx-konteyner> --format '{{json .NetworkSettings.Networks}}'
# networks:
#   nginx-net:
#     external: true
#     name: <nginx-agi-adi>
